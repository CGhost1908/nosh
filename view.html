<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosh Web Viewer</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="view.css">
    
    <!-- CodeMirror & Dracula Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/dracula.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/rust/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/go/go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/swift/swift.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/shell/shell.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/yaml/yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/markdown/markdown.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="nav-left">
            <img src="icon.ico" class="top-nav-logo" alt="Nosh" onclick="window.location.href='https://github.com/CGhost1908/nosh'" title="Nosh">
            <span class="brand-badge">NOSH</span>
            <span class="nav-divider">/</span>
            <span class="page-title" id="nav-title">Loading note...</span>
        </div>
        <div class="nav-actions">
            <button class="copy-link-btn" onclick="copyShareUrl()" title="Copy Link to Clipboard">
                <iconify-icon icon="solar:copy-linear"></iconify-icon>
                <span>Copy Link</span>
            </button>
            <a href="https://github.com/CGhost1908/nosh" target="_blank" rel="noopener noreferrer" class="top-nav-button">
                <iconify-icon icon="solar:download-square-linear"></iconify-icon>
                <span>Get Nosh App</span>
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="content">
        <div class="loading-container" id="loading-state">
            <div class="spinner"></div>
            <div>Loading note from Supabase Cloud...</div>
        </div>

        <div class="error-card" id="error-state" style="display: none;">
            <iconify-icon icon="solar:danger-triangle-linear" style="font-size: 40px; color: #ef4444; margin-bottom: 8px;"></iconify-icon>
            <h2 id="error-title">Note Not Found</h2>
            <p id="error-desc">The requested note does not exist or may have been removed.</p>
            <a href="https://github.com/CGhost1908/nosh" class="top-nav-button">Visit Nosh on GitHub</a>
        </div>

        <article id="note-article" class="reader-card" style="display: none;">
            <div class="meta-bar">
                <span class="meta-badge" id="doc-date">Published via Nosh</span>
                <span>·</span>
                <span id="doc-views">Public Document</span>
            </div>
            <div id="note-body"></div>
        </article>
    </main>

    <div class="toast-msg" id="toast">Link copied to clipboard!</div>

    <script>
        // Supabase Cloud Configuration
        const SUPABASE_URL = 'https://buvtdaxlibejpjlkxaor.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dnRkYXhsaWJlanBqbGt4YW9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MjA2NTIsImV4cCI6MjEwOTA5NjY1Mn0.Kd2bR8gAm2lLGKHLhV1CJCacuLE1NKPptVmIJiKZnNY';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2200);
        }

        function copyShareUrl() {
            navigator.clipboard.writeText(window.location.href)
                .then(() => showToast('Share link copied to clipboard!'))
                .catch(() => alert('Failed to copy link.'));
        }

        function mapLanguageMode(raw) {
            if (!raw) return 'javascript';
            const lower = raw.toLowerCase().trim();
            if (lower.includes('py')) return 'python';
            if (lower.includes('rust')) return 'rust';
            if (lower.includes('go')) return 'go';
            if (lower.includes('swift')) return 'swift';
            if (lower.includes('c++') || lower.includes('cpp')) return 'text/x-c++src';
            if (lower === 'c' || lower.includes('x-csrc')) return 'text/x-csrc';
            if (lower.includes('java')) return 'text/x-java';
            if (lower.includes('sql')) return 'sql';
            if (lower.includes('sh') || lower.includes('bash')) return 'shell';
            if (lower.includes('html') || lower.includes('xml')) return 'xml';
            if (lower.includes('css')) return 'css';
            if (lower.includes('json')) return 'javascript';
            if (lower.includes('yaml') || lower.includes('yml')) return 'yaml';
            if (lower.includes('markdown') || lower.includes('md')) return 'markdown';
            if (lower.includes('ts') || lower.includes('typescript')) return 'javascript';
            return 'javascript';
        }

        function upgradeLegacyBlocksInDOM(container) {
            // Find all legacy .code-block-layer elements
            const legacyLayers = container.querySelectorAll('.code-block-layer');
            legacyLayers.forEach(layer => {
                const parent = layer.parentElement;
                const ta = parent ? parent.querySelector('textarea.code') : null;
                if (!ta) return;

                const langP = layer.querySelector('p');
                const rawLang = (langP ? langP.textContent.trim() : '') || ta.getAttribute('language') || 'javascript';

                let code = ta.value || '';
                if (!code) {
                    const deadCM = parent.querySelector('.CodeMirror');
                    if (deadCM) {
                        const lines = deadCM.querySelectorAll('.CodeMirror-line');
                        if (lines && lines.length > 0) {
                            code = Array.from(lines).map(l => l.textContent).join('\n');
                        }
                    }
                }
                if (!code) code = ta.textContent || '';

                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';

                const header = document.createElement('div');
                header.className = 'code-block-header';
                header.innerHTML = `
                    <div class="code-header-left">
                        <div class="code-window-dots">
                            <span class="code-dot red"></span>
                            <span class="code-dot yellow"></span>
                            <span class="code-dot green"></span>
                        </div>
                        <span class="code-lang-tag">
                            <iconify-icon icon="solar:code-square-linear"></iconify-icon>
                            <span class="lang-name">${rawLang}</span>
                        </span>
                    </div>
                    <div class="code-block-actions">
                        <button class="code-action-btn wrap-btn" title="Toggle Line Wrap">Wrap</button>
                        <button class="code-action-btn copy-btn" title="Copy Code">Copy</button>
                    </div>
                `;

                const newTa = document.createElement('textarea');
                newTa.className = 'code';
                newTa.setAttribute('language', rawLang);
                newTa.value = code;
                newTa.textContent = code;

                wrapper.appendChild(header);
                wrapper.appendChild(newTa);

                if (parent === container) {
                    layer.remove();
                    ta.replaceWith(wrapper);
                } else {
                    parent.replaceWith(wrapper);
                }
            });

            // Clean any dead static .CodeMirror divs restored from HTML
            container.querySelectorAll('.code-block-wrapper .CodeMirror').forEach(el => el.remove());
        }

        async function fetchPublishedNote() {
            const params = new URLSearchParams(window.location.search);
            const noteId = params.get('id');

            const loadingEl = document.getElementById('loading-state');
            const errorEl = document.getElementById('error-state');
            const articleEl = document.getElementById('note-article');
            const navTitle = document.getElementById('nav-title');
            const noteBody = document.getElementById('note-body');
            const docDate = document.getElementById('doc-date');

            if (!noteId) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                document.getElementById('error-title').textContent = 'No Note Specified';
                document.getElementById('error-desc').textContent = 'Please provide a valid document link with a note ID.';
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/shared_notes?id=eq.${encodeURIComponent(noteId)}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to fetch note (HTTP ${response.status})`);
                }

                const data = await response.json();
                if (!data || data.length === 0) {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                    document.getElementById('error-title').textContent = 'Note Not Found';
                    document.getElementById('error-desc').textContent = 'The note you are looking for does not exist or has expired.';
                    return;
                }

                const note = data[0];
                document.title = `${note.title || 'Note'} - Nosh Web Viewer`;
                if (navTitle) navTitle.textContent = note.title || 'Untitled Note';

                if (docDate && note.created_at) {
                    const d = new Date(note.created_at);
                    docDate.textContent = `Published on ${d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })} at ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
                }

                if (noteBody) {
                    noteBody.innerHTML = note.content;
                    initInteractiveElements(noteBody);
                }

                loadingEl.style.display = 'none';
                articleEl.style.display = 'block';

            } catch (err) {
                console.error('Error fetching note:', err);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                document.getElementById('error-title').textContent = 'Connection Error';
                document.getElementById('error-desc').textContent = err.message || 'Unable to connect to Supabase Cloud.';
            }
        }

        function initInteractiveElements(container) {
            // 1. Upgrade any legacy code blocks in the HTML
            upgradeLegacyBlocksInDOM(container);

            // 2. Initialize CodeMirror on all .code-block-wrapper textareas
            const codeBlocks = container.querySelectorAll('.code-block-wrapper');
            codeBlocks.forEach(wrapper => {
                const ta = wrapper.querySelector('textarea.code');
                if (!ta) return;

                const rawLang = ta.getAttribute('language') || 'javascript';
                const mode = mapLanguageMode(rawLang);

                let cm = null;
                if (window.CodeMirror) {
                    cm = CodeMirror.fromTextArea(ta, {
                        mode: mode,
                        theme: 'dracula',
                        readOnly: true,
                        lineNumbers: true,
                        lineWrapping: true,
                        tabSize: 4
                    });
                }

                // Line Wrapping toggle
                const wrapBtn = wrapper.querySelector('.wrap-btn');
                if (wrapBtn && cm) {
                    wrapBtn.onclick = () => {
                        const cur = cm.getOption('lineWrapping');
                        cm.setOption('lineWrapping', !cur);
                        wrapBtn.classList.toggle('active', !cur);
                    };
                }

                // Copy Code action
                const copyBtn = wrapper.querySelector('.copy-btn');
                if (copyBtn) {
                    copyBtn.onclick = () => {
                        const code = cm ? cm.getValue() : (ta.value || ta.textContent || '');
                        navigator.clipboard.writeText(code).then(() => {
                            const origHTML = copyBtn.innerHTML;
                            copyBtn.innerHTML = `<iconify-icon icon="solar:check-circle-bold" style="color:#10b981"></iconify-icon> Copied!`;
                            setTimeout(() => { copyBtn.innerHTML = origHTML; }, 1800);
                            showToast('Code copied to clipboard');
                        }).catch(e => {
                            console.error('Copy failed:', e);
                        });
                    };
                }
            });

            // 3. Interactive Checklist Checkboxes
            const checkboxes = container.querySelectorAll('.checklist-checkbox');
            checkboxes.forEach(cb => {
                cb.onchange = () => {
                    const item = cb.closest('.checklist-item');
                    if (item) {
                        item.classList.toggle('completed', cb.checked);
                    }
                };
            });
        }

        window.addEventListener('DOMContentLoaded', fetchPublishedNote);
    </script>
</body>
</html>
